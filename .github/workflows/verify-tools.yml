name: Verify Tool Database

on:
  schedule:
    - cron: '0 13 * * 1'   # every Monday, 13:00 UTC
  workflow_dispatch: {}     # allows manually triggering a run from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 anthropic

      - name: Run verification script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/verify_tools.py

      - name: Commit auto-approved minor updates
        run: |
          git config user.name "tool-db-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- tools.json; then
            git add tools.json
            git commit -m "Auto-update: weekly tool pricing verification"
            git push
          else
            echo "No auto-approved changes to tools.json this week."
          fi

      - name: Open PR for flagged items
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s flags.json ] && [ "$(cat flags.json)" != "[]" ]; then
            BRANCH="review/tools-$(date +%Y-%m-%d)-${{ github.run_id }}"
            git checkout -b "$BRANCH"
            git add flags.json flags.md
            git commit -m "Flag tool database items for manual review"
            git push origin "$BRANCH"
            gh pr create \
              --title "Tool database: items need review ($(date +%Y-%m-%d))" \
              --body-file flags.md \
              --base main \
              --head "$BRANCH"
          else
            echo "Nothing flagged this week, no PR needed."
          fi
